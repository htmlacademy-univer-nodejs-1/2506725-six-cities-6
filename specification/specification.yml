openapi: 3.1.0
info:
  title: Спецификация API
  version: "1.0.0"
  description: API для учебного проекта "Шесть городов"

tags:
  - name: users
    description: Действия с пользователем.
  - name: offers
    description: Действия с предложениями.
  - name: comments
    description: Действия с комментариями.
  - name: auth
    description: Действия для авторизации, регистрации и контроля токенов.

paths:
  /users/register:
    post:
      tags:
        - auth
      summary: Регистрация нового пользователя
      description: Регистрация нового пользователя в системе.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/user"
      responses:
        "201":
          description: Пользователь успешно зарегистрирован.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/id"
                  - $ref: "#/components/schemas/createUser"
        "400":
          description: Неверный формат данных!
        "409":
          description: Пользователь с таким email уже существует!

  /users/login:
    get:
      tags:
        - auth
      summary: Проверка состояния пользователя
      description: Проверка JWT-токена и получение информации о текущем пользователе.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Пользователь авторизован.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/id"
                  - $ref: "#/components/schemas/createUser"
        "401":
          description: Пользователь не авторизован!
    post:
      tags:
        - auth
      summary: Авторизация пользователя
      description: Авторизация пользователя в системе и отправка ему JWT-токена.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                  example: "oleg@example.com"
                password:
                  type: string
                  format: password
                  minLength: 6
                  maxLength: 12
                  example: "qwerty123"
      responses:
        "200":
          description: Пользователь успешно авторизован.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/token"
        "400":
          description: Неверный формат данных!

  /users/logout:
    post:
      tags:
        - auth
      summary: Выход пользователя из системы
      description: Выход пользователя из системы и удаление его refresh-токена.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Пользователь успешно вышел из системы.
        "401":
          description: Пользователь не авторизован!

  /users/refresh:
    post:
      tags:
        - auth
      summary: Обновление токена доступа
      description: Получение нового токена доступа с помощью refresh-токена.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/token"
      responses:
        "200":
          description: Новый токен доступа успешно получен.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/token"
        "401":
          description: Пользователь не авторизован!

  /offers/me/favorites:
    get:
      tags:
        - offers
      summary: Получение списка избранных
      description: Получение списка избранных объявлений авторизованного пользователя. 
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Список избранных объявлений
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  allOf:
                    - $ref: "#/components/schemas/id"
                    - $ref: "#/components/schemas/offer"
        "401":
          description: Пользователь не авторизован!

  /offers:
    get:
      tags:
        - offers
      summary: Получение списка объявлений. По умолчанию 60 штук.
      description: Получение списка объявлений, которые можно отфильтровать/отсортировать. По умолчанию возвращает 60 штук. Максимум 1000 штук.
      parameters:
        - name: limit
          in: query
          description: Количество запрашиваемых объявлений.
          schema:
            type: integer
            default: 60
            maximum: 1000
      responses:
        "200":
          description: Список объявлений.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: "#/components/schemas/offer"
    post:
      tags:
        - offers
      summary: Создание нового объявления
      description: Создание нового объявления пользователем.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/offer"
      responses:
        "201":
          description: Объявление успешно создано.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/offer"
        "400":
          description: Неверный формат данных!

  /offers/{offerId}:
    get:
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/id"
      tags:
        - offers
      summary: Получение информации об объявлении с offerId
      description: Получение подробной информации об объявлении по его идентификатору.
      responses:
        "200":
          description: Информация об объявлении
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/offer"
        "404":
          description: Объявление с указанным идентификатором не найдено!
    patch:
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/id"
      tags:
        - offers
      summary: Обновление объявления
      description: Обновление информации об объявлении по его идентификатору.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/offer"
      responses:
        "200":
          description: Объявление успешно обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/offer"
        "400":
          description: Некорректные данные для обновления объявления
        "401":
          description: Пользователь не авторизован
        "404":
          description: Объявление с указанным идентификатором не найдено
    delete:
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/id"
      tags:
        - offers
      summary: Удаление объявления
      description: Удаление объявления(и всех комментариев к нему) по его идентификатору.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Объявление успешно удалено
        "401":
          description: Пользователь не авторизован
        "404":
          description: Объявление с указанным идентификатором не найдено

  /offers/premium:
    get:
      tags:
        - offers
      summary: Получение списка премиальных объявлений в городе.
      description: Получение списка премиальных объявлений в выбранном городе. Не более 3 штук.
      parameters:
        - name: city
          in: query
          required: true
          schema:
            type: string
            enum: [Paris, Cologne, Brussels, Amsterdam, Hamburg, Dusseldorf]
      responses:
        "200":
          description: Список премиальных объявлений успешно получен
          content:
            application/json:
              schema:
                type: array
                maxItems: 3
                items:
                  $ref: "#/components/schemas/offer"

  /offers/{offerId}/favorite:
    post:
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/id"
      tags:
        - offers
      summary: Добавление объявления в избранное
      description: Добавление объявления в список избранных пользователя.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Объявление успешно добавлено в избранное
        "401":
          description: Пользователь не авторизован!
        "404":
          description: Объявление с указанным идентификатором не найдено!
    delete:
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/id"
      tags:
        - offers
      summary: Удаление объявления из избранного
      description: Удаление объявления из списка избранных пользователя.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Объявление успешно удалено из избранного
        "401":
          description: Пользователь не авторизован!
        "404":
          description: Объявление с указанным идентификатором не найдено!

  /offers/{offerId}/comments:
    get:
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/id"
      tags:
        - comments
      summary: Получение комментариев к объявлению с offerId
      description: Получение списка всех комментариев, связанных с объявлением.
      responses:
        "200":
          description: Список комментариев
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: "#/components/schemas/comment"
        "404":
          description: Объявление с указанным идентификатором не найдено!
    post:
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/id"
      tags:
        - comments
      summary: Добавление комментария к объявлению
      description: Добавление нового комментария к объявлению пользователем.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/comment"
      responses:
        "201":
          description: Комментарий успешно добавлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/comment"
        "400":
          description: Неверный формат данных!
        "401":
          description: Пользователь не авторизован!
        "404":
          description: Объявление с указанным идентификатором не найдено!

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    token:
      type: object
      properties:
        token:
          type: string
          maxLength: 1024
          example: "eyJhbGciOi"
          description: JWT токен

    id:
      type: string
      format: uuid
      maxLength: 36
      example: "1234-abcd-5678-efgh"

    user:
      type: object
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
          example: "1234-abcd-5678-efgh"
        email:
          type: string
          format: email
          maxLength: 255
          example: "oleg@example.com"
        name:
          type: string
          minLength: 1
          maxLength: 15
          example: "Олег"
        avatarUrl:
          type: string
          format: uri
          maxLength: 500
          example: "https://example.com/avatar.jpg"
        password:
          type: string
          minLength: 6
          maxLength: 12
          example: "qwerty123"
        type:
          type: string
          enum: [Standard, Pro]
          example: "Standard"
      required:
        - id
        - email
        - name
        - password
        - type

    offer:
      type: object
      properties:
        name:
          type: string
          minLength: 10
          maxLength: 100
          example: "Пентхаус с видом на море"
        description:
          type: string
          minLength: 20
          maxLength: 1024
          example: "Отличное место для отдыха или вечеринки!"
        date:
          type: string
          maxLength: 30
          example: "2026-03-18"
        city:
          type: string
          enum: [Paris, Cologne, Brussels, Amsterdam, Hamburg, Dusseldorf]
          example: "Paris"
        preview:
          type: string
          format: uri
          maxLength: 500
          example: "https://example.com/preview.jpg"
        images:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: string
            format: uri
            maxLength: 500
        isPremium:
          type: boolean
          example: true
        isFavorite:
          type: boolean
          example: false
        rating:
          type: number
          format: float
          minimum: 1
          maximum: 5
          example: 4.9
        type:
          type: string
          enum: [apartment, house, room, hotel]
          example: "house"
        rooms:
          type: integer
          format: int32
          minimum: 1
          maximum: 8
          example: 3
        guests:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          example: 5
        price:
          type: integer
          format: int32
          minimum: 100
          maximum: 100000
          example: 10000
        features:
          type: array
          maxItems: 20
          items:
            type: string
            enum:
              [
                Breakfast,
                Air conditioning,
                Laptop friendly workspace,
                Baby seat,
                Washer,
                Towels,
                Fridge,
              ]
        authorId:
          type: string
          example: "507f1f77bcf86cd799439011"
        commentsCount:
          type: integer
          format: int32
          example: 5
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
            format: float
          example: [48.85661, 2.351499]

    comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
          example: "1234-abcd-5678-efgh"
        text:
          type: string
          minLength: 5
          maxLength: 1024
          example: "Необычное место с доброжелательным персоналом!"
        date:
          type: string
          maxLength: 30
          example: "2026-03-18T12:55:00Z"
        rating:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          example: 5
        userId:
          type: string
          format: uuid
          maxLength: 36
          example: "1234-abcd-5678-efgh"
        offerId:
          type: string
          format: uuid
          maxLength: 36
          example: "1234-abcd-5678-efgh"

    createUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
          example: "1234-abcd-5678-efgh"
        email:
          type: string
          format: email
          maxLength: 255
          example: "oleg@example.com"
        avatarUrl:
          type: string
          format: uri
          maxLength: 500
          example: "https://example.com/avatar.jpg"
        type:
          type: string
          enum: [Standard, Pro]
          example: "Standard"
